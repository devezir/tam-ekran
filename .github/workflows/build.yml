# BILINCLI OLARAK DEVRE DISI BIRAKILDI (INTENTIONALLY DISABLED FOR AUTOMATIC TRIGGERS)
#
# Bu GitHub Actions is akisi otomatik push/pull_request tetiklemeleri icin
# bilincl olarak devre disi birakilmistir (yalnizca manuel `workflow_dispatch` aktiftir).
# Gerekce: Birim testleri (`python test.py`) ve imzali Release APK uretimi (`python build.py`)
# yerel ortamda zorunlu test kapisiyla calistirilip dogrudan GitHub Releases'a yuklenmektedir.
# Ayrica `android-actions/setup-android@v3` eski `tools` paketini istedigi ve CI ortaminda
# `r8.jar` / `uber-apk-signer.jar` ayrica saglanmadigi icin otomatik calisma kapatilmistir.
# Tekrar aktif edilecekse: preinstalled Android SDK (`/usr/local/lib/android/sdk`) kullanilmali,
# `d8.jar` -> `r8.jar` ve `uber-apk-signer.jar` temin edilip `actions/setup-java@v5` secilmelidir.

name: Build & Test (Disabled Auto-Trigger)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure Android Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d "$SDK_ROOT/build-tools/"* | sort -V | tail -n 1)
          echo "ANDROID_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "JDK_HOME_BIN=$JAVA_HOME/bin" >> $GITHUB_ENV
          echo "ANDROID_JAR=$SDK_ROOT/platforms/android-34/android.jar" >> $GITHUB_ENV
      - name: Run Unit Tests
        run: python test.py
      - name: Build Debug APK
        run: python build.py --debug
      - uses: actions/upload-artifact@v4
        with:
          name: TamEkran-debug-apk
          path: TamEkran.apk
